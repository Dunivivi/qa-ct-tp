<a href="#main" class="sr-only z-50 rounded-lg bg-surface px-4 py-2 text-ink focus:not-sr-only focus:absolute focus:top-2 focus:left-2">Skip to content</a>

<!-- ≥1280px: brand | centred search | nav, with equal-width outer columns so the search stays centred.
     1024–1279px: the search fills the space between brand and nav (the nav is too wide to centre).
     Phone: brand + settings, then a full-width search, then the nav as one scrollable row.
     The search trigger looks like an input (2px border, 8px corners, 40px) so it reads as search. -->
<header data-region="header" class="flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-line bg-surface px-4 py-3 sm:px-8">
  <a routerLink="/" class="order-1 flex min-w-0 flex-1 items-center gap-2.5 text-ink no-underline lg:flex-none xl:flex-1 xl:basis-0">
    <app-owl-logo />
    <span class="font-display text-lg font-semibold whitespace-nowrap">CT-PT Practice</span>
    @if (total()) {
      <span class="hidden text-sm font-normal whitespace-nowrap text-subtle xl:inline">· {{ total() }} questions</span>
    }
  </a>

  <button type="button" (click)="palette.show(false)" aria-label="Search questions and commands" aria-keyshortcuts="Control+K Meta+K"
    class="order-3 flex min-h-10 w-full items-center gap-2 rounded-lg border-2 border-line-strong bg-surface px-3 text-sm text-muted hover:border-brand-500 hover:text-ink lg:order-2 lg:w-auto lg:max-w-md lg:flex-1 xl:w-72 xl:flex-none">
    <svg viewBox="0 0 20 20" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="9" cy="9" r="6" /><path d="M14 14l4 4" />
    </svg>
    <span class="flex-1 text-left">Search</span>
    <kbd class="rounded border border-line-strong px-1.5 font-sans text-xs text-subtle">{{ searchHint }}</kbd>
  </button>

  <!-- display:contents on phones lets the nav take its own full-width row in the header's flow. -->
  <div class="contents lg:order-3 lg:flex lg:items-center lg:justify-end lg:gap-1 xl:flex-1 xl:basis-0">
    <nav class="order-4 -mx-1 flex w-full gap-1 overflow-x-auto px-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden lg:order-none lg:mx-0 lg:w-auto lg:overflow-visible lg:px-0" aria-label="Main">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-brand-50 font-medium text-brand-600"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="flex min-h-10 shrink-0 items-center gap-1.5 rounded-lg px-3 text-sm whitespace-nowrap text-muted no-underline hover:bg-inset"
        >{{ link.label }}
          @if (link.path === '/learn' && dueCount()) {
            <span class="rounded-full bg-brand-500 px-1.5 text-xs font-semibold text-on-brand" [attr.aria-label]="dueCount() + ' cards due'">{{ dueCount() }}</span>
          }
        </a>
      }
    </nav>
  </div>

  @if (showResume()) {
    <a routerLink="/test" class="order-5 flex min-h-10 max-w-full items-center gap-2 rounded-lg bg-inverse px-3 text-sm text-on-inverse no-underline hover:opacity-90 lg:mx-auto">
      <span class="size-2 shrink-0 rounded-full bg-ok-500" aria-hidden="true"></span>
      <span class="truncate">Resume: {{ resumeLabel() }}</span>
    </a>
  }
</header>

<div id="main" tabindex="-1" class="outline-none">
  <router-outlet />
</div>

<app-command-palette #palette />
<app-settings-drawer />
<app-confirm-host />
